<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tempered Glass Finder</title>

<!-- Installable web app -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0369A1">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glass Finder">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Favicons -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

<!-- Tailwind CSS (JIT, no build step) -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Flowbite 4.0 component styles -->
<link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<style>

*{
  font-family: "Inter", sans-serif;
 
}
  ::selection { background: #bae6fd; }

  /* "glass" panel used throughout — literal to the product being searched */
  .glass {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  mark {
    background: #fde68a;
    color: #713f12;
    border-radius: 3px;
    padding: 0 2px;
  }

  .box-image {
    background: repeating-linear-gradient(135deg, #eef2f7 0px, #eef2f7 10px, #e6ecf3 10px, #e6ecf3 20px);
  }

  /* hide the browser's built-in clear (x) icon on type="search" inputs —
     we render our own "Clear" button instead */
  input[type="search"]::-webkit-search-cancel-button,
  input[type="search"]::-webkit-search-decoration {
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="search"]::-ms-clear { display: none; width: 0; height: 0; }

  @media (prefers-reduced-motion: no-preference) {
    .card-enter { animation: rise .35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  }
</style>
</head>

<body class="min-h-screen bg-gradient-to-b from-sky-50 via-slate-50 to-slate-100 text-slate-900">

  <!-- Sticky glass search header -->
  <header class="sticky top-0 z-20 border-b border-slate-200/70 glass">
    <div class="mx-auto w-full max-w-5xl px-4 sm:px-6 py-4">

      <div class="flex items-start justify-between gap-4">
  <div>
    <h1 class="text-2xl sm:text-3xl font-bold tracking-wider text-slate-900">
      Tempered Glass Finder
    </h1>
    <p class="mt-1 text-sm text-slate-500">
      Search a phone model to find its matching box.
    </p>
  </div>

  <span id="boxCount"
    class="hidden sm:inline-flex shrink-0 items-center rounded-full bg-sky-100 px-3 py-1 text-xs font-semibold text-sky-700 ring-1 ring-inset ring-sky-200">
  </span>
</div>

      <!-- Search input -->
      <div class="mt-4 relative">
        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
          <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/>
          </svg>
        </div>
        <input id="search" type="search" autofocus
          placeholder="Search phone model… e.g. Samsung A16"
          class="block w-full rounded-xl border border-slate-300 bg-white py-3 pl-11 pr-24 text-base text-slate-900 placeholder:text-slate-400 shadow-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-500/40 focus:outline-none">
        <button id="clear" type="button"
          class="absolute inset-y-1.5 right-1.5 inline-flex items-center rounded-xl bg-slate-800 px-3 text-sm font-semibold text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400">
          Clear
        </button>
      </div>
      <p class="mt-2 text-xs text-slate-400">Search by brand, model, or model number.</p>
    </div>
  </header>

  <!-- iOS install hint (Safari has no native install prompt — this walks the user through it) -->
  <div id="iosInstallHint" class="hidden mx-auto w-full max-w-5xl px-4 sm:px-6">
    <div class="mb-2 flex items-start gap-3 rounded-xl border border-sky-200 bg-sky-50 px-4 py-3 text-sm text-sky-900">
      <svg class="mt-0.5 h-5 w-5 shrink-0 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <p>Install this app: tap the <strong>Share</strong> icon, then <strong>Add to Home Screen</strong>.</p>
      <button id="dismissIosHint" type="button" class="ml-auto text-sky-500 hover:text-sky-700" aria-label="Dismiss">✕</button>
    </div>
  </div>

  <main class="mx-auto w-full max-w-5xl px-4 sm:px-6 py-6 pb-16">
    <section id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>

  <script>
    // Register service worker for offline support / installability
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }

    // Show the "Add to Home Screen" hint only on iOS Safari, and only if not
    // already installed (standalone) or previously dismissed.
    (function () {
      const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isStandalone = window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches;
      const dismissed = localStorage.getItem("iosInstallHintDismissed") === "1";

      if (isIos && !isStandalone && !dismissed) {
        const hint = document.getElementById("iosInstallHint");
        hint.classList.remove("hidden");
        document.getElementById("dismissIosHint").addEventListener("click", () => {
          hint.classList.add("hidden");
          localStorage.setItem("iosInstallHintDismissed", "1");
        });
      }
    })();
  </script>
</body>
</html>
