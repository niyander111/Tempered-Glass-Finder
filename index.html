<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <title>Tempered Glass Finder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style>
    /* Browser native search cancel icon reset */
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-decoration {
      -webkit-appearance: none;
      appearance: none;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen pb-16">

  <div class="max-w-5xl mx-auto px-4 sm:px-6 pt-10 sm:pt-12">

    <div class="mb-6 text-center">
      <h1 class="text-3xl font-bold  tracking-tight text-slate-900">
        Tempered Glass Finder
      </h1>
      <p class="text-slate-500 text-md  mt-1">
        Search your phone model to find the matching tempered glass box.
      </p>
    </div>

    <div class="mb-6">
      <div class="flex items-center w-full h-12 px-3.5 bg-white border border-slate-400 rounded-2xl transition-colors focus-within:border-slate-500 focus-within:ring-1 focus-within:ring-slate-700">
        
        <svg class="w-4 h-4 text-slate-400 shrink-0 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>

 <input
  id="search"
  type="search"
  autofocus
  autocomplete="off"
  autocorrect="off"
  autocapitalize="off"
  spellcheck="false"
  placeholder="Search phone model (e.g. iPhone 13, Galaxy A54)..."
  aria-label="Search phone model"
  class="w-full bg-transparent text-base sm:text-sm text-slate-900 placeholder-slate-400 outline-none font-medium"
>

        <button
          id="clear"
          type="button"
          aria-label="Clear search"
          class="hidden p-1 text-slate-400 hover:text-slate-600 rounded-md hover:bg-slate-100 cursor-pointer transition-colors"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between mb-4 px-0.5">
      <h2 class="text-sm font-semibold text-slate-800">
        Results
      </h2>
      <span id="boxCount" class="text-xs font-medium text-slate-500 bg-white border border-slate-200 px-2.5 py-1 rounded-md">
        0 boxes
      </span>
    </div>

    <main>
      <div id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>

  </div>

  <script src="data.js"></script>

  <script>
    const searchInput = document.getElementById("search");
    const clearButton = document.getElementById("clear");
    const results = document.getElementById("results");
    const boxCount = document.getElementById("boxCount");

    function normalize(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/samsung galaxy/g, "samsung")
        .replace(/oneplus/g, "one plus")
        .replace(/xiaomi/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function highlightModel(model, query) {
      const terms = normalize(query).split(/\s+/).filter(Boolean);
      let text = escapeHtml(model);

      terms.forEach(term => {
        const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        text = text.replace(
          new RegExp(`(${escapedTerm})`, "gi"),
          `<mark class="bg-amber-200 text-amber-950 px-1 py-0.5 rounded font-semibold">$1</mark>`
        );
      });

      return text;
    }

    function findMatches(query) {
      const q = normalize(query);
      if (!q) return [];

      const terms = q.split(/\s+/).filter(Boolean);

      return BOXES
        .map(box => ({
          ...box,
          matchingModels: box.models.filter(model => {
            const modelText = normalize(model);
            return terms.every(term => modelText.includes(term));
          })
        }))
        .filter(box => box.matchingModels.length);
    }

    function createModelChips(models, query) {
      return models
        .map(model => `
          <span class="inline-flex items-center text-xs font-medium px-2.5 py-1 bg-slate-100 text-slate-700 rounded-md border border-slate-200 leading-snug break-words">
            ${highlightModel(model, query)}
          </span>
        `)
        .join("");
    }

    function render(query) {
      boxCount.textContent = `${typeof BOXES !== 'undefined' ? BOXES.length : 0} boxes`;

      /* Empty State */
      if (!query.trim()) {
        clearButton.classList.add("hidden");
        clearButton.classList.remove("flex");

        results.innerHTML = `
          <div class="col-span-full py-16 px-4 text-center bg-white border border-slate-200 border-dashed border-2 rounded-xl">
            <div class="w-10 h-10 mx-auto mb-3 rounded-full bg-stone-200 flex items-center justify-center text-slate-500">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
            <h3 class="text-sm font-semibold text-slate-900">Search for tempered glass</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">
              Type your handset model above to check available boxes and matching items.
            </p>
          </div>
        `;
        return;
      }

      clearButton.classList.remove("hidden");
      clearButton.classList.add("flex");

      const matches = findMatches(query);

      /* No Matches State */
      if (!matches.length) {
        results.innerHTML = `
          <div class="col-span-full py-16 px-4 text-center bg-white border border-slate-200 rounded-xl">
            <div class="w-10 h-10 mx-auto mb-3 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
              </svg>
            </div>
            <h3 class="text-sm font-semibold text-slate-900">No matching box found</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">
              No results found for "${escapeHtml(query)}". Try another model name or check spelling.
            </p>
          </div>
        `;
        return;
      }

      /* Product Cards */
      results.innerHTML = matches
        .map(box => `
          <article class="flex flex-col bg-white border border-slate-200 rounded-xl overflow-hidden hover:border-slate-300 transition-colors">
            
            <div class="relative w-full aspect-square bg-slate-100 border-b border-slate-100 overflow-hidden">
              <img
                class="w-full h-full object-cover"
                src="${escapeHtml(box.image)}"
                alt="${escapeHtml(box.id)}"
                loading="lazy"
              >
            </div>
            
            <div class="p-4 flex flex-col flex-1">
              
              <div class="flex items-start justify-between gap-2">
                <div>
                  <h3 class="text-sm font-bold text-slate-900 leading-snug">
                    ${escapeHtml(box.id)}
                  </h3>
                  ${box.variant ? `
                    <p class="text-xs text-slate-500 font-medium mt-0.5">
                      ${escapeHtml(box.variant)}
                    </p>
                  ` : ""}
                </div>

                <span class="inline-flex items-center text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200 shrink-0">
                  ${box.matchingModels.length} match${box.matchingModels.length === 1 ? "" : "es"}
                </span>
              </div>

              <div class="mt-3.5 pt-3 border-t border-slate-100">
                <span class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2">
                  Matching Models
                </span>
                <div class="flex flex-wrap gap-1.5">
                  ${createModelChips(box.matchingModels, query)}
                </div>
              </div>

            </div>
          </article>
        `)
        .join("");
    }

    searchInput.addEventListener("input", () => render(searchInput.value));

    clearButton.addEventListener("click", () => {
      searchInput.value = "";
      render("");
      searchInput.focus();
    });

    render("");
  </script>
</body>
</html>
